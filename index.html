<style>
/* Layout: one-screen workbench. A sheet of squared school paper holds the 3D scene (top on phones, left on desktop); the tool panel sits beside or below it. */
:root{
  --paper:#edf1f7; --surface:#ffffff; --surface-2:#f4f6fa; --ink:#131b31; --ink-2:#56607a; --ink-3:#8a93a8;
  --line:#d5dbe7; --grid:rgba(38,74,160,.10); --grid-strong:rgba(38,74,160,.18);
  --accent:#1d4ed8; --accent-soft:#e3eaff; --accent-ink:#ffffff;
  --mark:#e89a00; --err:#d1263f; --err-soft:#fde7ea; --ok:#13804f; --ok-soft:#e1f4ea;
  --face-base:#86a8ff; --face-side:#c3d3ff; --face-top:#a9c0ff; --edge:#131b31; --edge-hidden:#5f6c8a;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;

}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0e1320; --surface:#151c2c; --surface-2:#1b2336; --ink:#e8edf8; --ink-2:#a3adc4; --ink-3:#6f7a93;
    --line:#2a3349; --grid:rgba(140,170,255,.07); --grid-strong:rgba(140,170,255,.13);
    --accent:#7ea2ff; --accent-soft:#1f2c50; --accent-ink:#0b1020;
    --mark:#ffb627; --err:#ff5c72; --err-soft:#3a1822; --ok:#4bd18f; --ok-soft:#14301f;
    --face-base:#3f63c4; --face-side:#2a3f78; --face-top:#3552a0; --edge:#e8edf8; --edge-hidden:#8d9ab8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0e1320; --surface:#151c2c; --surface-2:#1b2336; --ink:#e8edf8; --ink-2:#a3adc4; --ink-3:#6f7a93;
  --line:#2a3349; --grid:rgba(140,170,255,.07); --grid-strong:rgba(140,170,255,.13);
  --accent:#7ea2ff; --accent-soft:#1f2c50; --accent-ink:#0b1020;
  --mark:#ffb627; --err:#ff5c72; --err-soft:#3a1822; --ok:#4bd18f; --ok-soft:#14301f;
  --face-base:#3f63c4; --face-side:#2a3f78; --face-top:#3552a0; --edge:#e8edf8; --edge-hidden:#8d9ab8;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.brand{display:flex;align-items:center;gap:8px;flex:none}
.brand svg{width:28px;height:28px;display:block}
.brand b{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.01em}
.tabs{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:8px 12px;border-radius:8px;font-weight:600;font-size:14px;color:var(--ink-2);white-space:nowrap}
.tab .ts{display:none}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.lang button{border:0;background:transparent;padding:6px 9px;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--ink-2)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

.stage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 380px}
.view{position:relative;min-width:0;min-height:0;overflow:hidden;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid-strong) 1px,transparent 1px),linear-gradient(90deg,var(--grid-strong) 1px,transparent 1px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:100px 100px,100px 100px,20px 20px,20px 20px}
.view canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;outline:none}
.overlay{position:absolute;inset:0;pointer-events:none}
.lbl{position:absolute;left:0;top:0;font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--ink);transform:translate(-50%,-50%);white-space:nowrap;text-shadow:0 0 3px var(--paper),0 0 3px var(--paper),0 0 2px var(--paper);will-change:transform;transition:opacity .15s}
.lbl.small{font-size:11px;color:var(--ink-2)}
.lbl.el{font-family:var(--f-body);font-size:12px;font-weight:700;background:var(--mark);color:#1b1300;padding:2px 7px;border-radius:6px;text-shadow:none}
.lbl.pt{color:var(--mark)}
.hbtn{position:absolute;left:0;top:0;pointer-events:auto;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:2px solid var(--accent);background:var(--surface);color:var(--accent);font-size:19px;font-weight:700;line-height:24px;padding:0;box-shadow:0 2px 6px rgba(0,0,0,.15);will-change:transform}
.hbtn.del{border-color:var(--err);color:var(--err);width:24px;height:24px;margin:-12px 0 0 -12px;font-size:15px;line-height:19px}
.hbtn:active{transform:scale(.92)}

.vtools{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:10px;display:flex;flex-direction:column;gap:6px;z-index:3}
.vbtn{min-width:40px;height:36px;padding:0 8px;border:1px solid var(--line);background:var(--surface);border-radius:9px;font-size:12px;font-weight:600;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:4px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.vbtn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.vbtn svg{width:18px;height:18px}
.vgap{height:4px}
.vtitle{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:10px;z-index:3;pointer-events:none}
.vtitle .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);font-weight:600}
.vtitle .n{font-family:var(--f-display);font-weight:700;font-size:18px;line-height:1.2}
.hint{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:64px;background:var(--ink);color:var(--surface);font-size:12.5px;padding:7px 11px;border-radius:10px;max-width:min(420px,calc(100% - 100px));z-index:2;transition:opacity .5s;pointer-events:none}
.hint.gone{opacity:0}

.vbottom{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 max(10px,env(safe-area-inset-right,0px)) 10px max(10px,env(safe-area-inset-left,0px));z-index:3;pointer-events:none}
.vbottom > *{pointer-events:auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 20px rgba(10,20,50,.12)}
.info{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;max-width:min(520px,100%);font-size:14px}
.info .sw{width:12px;height:12px;border-radius:3px;background:var(--mark);margin-top:4px;flex:none}
.info b{display:block;font-weight:700}
.info span{color:var(--ink-2)}
.info .x{margin-left:auto;border:0;background:transparent;font-size:20px;line-height:1;color:var(--ink-3);padding:0 2px}
.fold{display:flex;align-items:center;gap:10px;padding:8px 10px;width:min(560px,100%)}
.play{flex:none;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:9px;padding:9px 14px;font-size:14px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.fold input{flex:1;min-width:0;accent-color:var(--accent)}
.fold .ends{font-size:11px;color:var(--ink-2);display:flex;flex-direction:column;line-height:1.2;text-align:right;flex:none}
.quiz{padding:12px 14px;width:min(460px,100%);display:flex;flex-direction:column;gap:10px;align-items:stretch}
.quiz p{margin:0;font-weight:600}
.quiz .row{display:flex;gap:8px}
.quiz .row button{flex:1}
.res{padding:2px 0 0;font-size:14px}
.res.good{color:var(--ok)} .res.bad{color:var(--err)}

.panel{min-width:0;min-height:0;overflow-y:auto;background:var(--surface);border-left:1px solid var(--line);padding-block:6px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sec{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.sec:last-child{border-bottom:0}
.sec h2{margin:0;font-family:var(--f-display);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-2)}
.sub{font-size:12px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip.mk[aria-pressed="true"]{background:var(--mark);border-color:var(--mark);color:#1b1300}
.chip .sym{font-family:var(--f-mono);font-size:12px;opacity:.75}
.param{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.param label{font-size:13.5px;color:var(--ink-2)}
.param output{font-family:var(--f-mono);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.param .row{grid-column:1/-1;display:flex;align-items:center;gap:8px}
.param input[type=range]{flex:1;min-width:0;accent-color:var(--accent);height:28px}
.step{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);font-size:18px;font-weight:600;line-height:1;padding:0;flex:none}
.sw-row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px}
.switch{appearance:none;width:42px;height:24px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(18px)}
.sheet{font-size:14px;display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.sheet .r{display:grid;grid-template-columns:1fr;gap:2px;padding:9px 12px;border-bottom:1px dashed var(--line)}
.sheet .r:last-child{border-bottom:0}
.sheet .r.total{background:var(--accent-soft)}
.sheet .k{font-size:12.5px;color:var(--ink-2)}
.sheet .f{font-family:var(--f-mono);font-size:13.5px;overflow-wrap:anywhere}
.sheet .f b{font-weight:600}
.sheet sub{font-size:.72em}
.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.counts div{background:var(--surface-2);border-radius:8px;padding:8px 4px}
.counts b{display:block;font-family:var(--f-mono);font-size:20px}
.counts span{font-size:12px;color:var(--ink-2)}
.euler{font-size:13px;color:var(--ink-2);font-family:var(--f-mono)}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.checks li{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:8px;background:var(--surface-2)}
.checks li.ok{background:var(--ok-soft)}
.checks li.bad{background:var(--err-soft)}
.checks li i{font-style:normal;font-weight:800;flex:none;width:16px;text-align:center}
.checks li.ok i{color:var(--ok)} .checks li.bad i{color:var(--err)} .checks li.wait i{color:var(--ink-3)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:9px 14px;font-weight:600;font-size:14px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
.note{font-size:13px;color:var(--ink-2);margin:0}
.legend{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}
.legend span{display:flex;gap:8px;align-items:center}
.legend i{width:18px;height:4px;border-radius:2px;flex:none}
.prog{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .2s}
.about{font-size:12.5px;color:var(--ink-3)}

.modal{position:fixed;inset:0;background:rgba(8,12,24,.55);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .card{width:min(760px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.modal header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.modal header h3{margin:0;font-family:var(--f-display);font-size:15px;flex:1}
.modal .body{overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:0}
.svgbox{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;overflow:auto}
.svgbox svg{display:block;width:100%;height:auto;max-height:55vh}
.modal footer{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.scale{display:flex;align-items:center;gap:8px;font-size:14px}
.scale input{width:72px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
#printArea{display:none}
@media print{
  body{overflow:visible;background:#fff}
  .app,.modal{display:none!important}
  #printArea{display:block!important}
  #printArea svg{display:block}
  @page{size:A4;margin:10mm}
}

@media (max-width: 899px){
  .stage{grid-template-columns:1fr;grid-template-rows:minmax(300px,56%) minmax(0,1fr)}
  .panel{border-left:0;border-top:1px solid var(--line)}
  .brand b{display:none}
}
@media (max-width: 899px){
  .vtools [data-z="in"],.vtools [data-z="out"]{display:none}
  .vbtn{height:32px;min-width:36px;font-size:11.5px}
  .vtools{gap:5px}
}
@media (max-width: 480px){
  .brand{display:none}
  .tab .tl{display:none} .tab .ts{display:inline}
  .top{gap:8px}
}
@media (max-width: 420px){
  .tab{padding:8px 9px;font-size:13px}
  .vtitle .n{font-size:16px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>

const sub=k=>`<sub>${t(k)}</sub>`;

function areaRows(shape,p){

  const row=(k,f,total)=>R.push({k,f,total});
  const nf=(n,a)=> n===3? [`(√3/4)·a²`, Math.sqrt(3)/4*a*a]: n===4? ['a²',a*a]: n===6? ['(3√3/2)·a²',3*Math.sqrt(3)/2*a*a]: [`n·a² / (4·tg(180°/n))`, n*a*a/(4*Math.tan(PI/n))];
  if(shape==='cube'){ const S=6*p.a*p.a; row(t('kFull'),`S = 6a² = 6·${fmt(p.a)}² = <b>${fmt(S)}</b>${u}`,1); row(t('kDiag'),`d = a√3 ≈ ${fmt(p.a*Math.sqrt(3))} ${t('cm')}`); }
  else if(shape==='box'){ const {a,b,c}=p, S=2*(a*b+b*c+a*c); row(t('kFull'),`S = 2(ab + bc + ac) = 2(${fmt(a*b)} + ${fmt(b*c)} + ${fmt(a*c)}) = <b>${fmt(S)}</b>${u}`,1); row(t('kDiag'),`d = √(a² + b² + c²) ≈ ${fmt(Math.hypot(a,b,c))} ${t('cm')}`); }
  else if(shape==='prism'){ const {n,a,h}=p, [ff,Sb]=nf(n,a), Sl=n*a*h;
    row(t('kBase'),`${sb} = ${ff} ≈ ${fmt(Sb)}${u}`); row(t('kLat'),`${sl} = P·h = n·a·h = ${n}·${fmt(a)}·${fmt(h)} = ${fmt(Sl)}${u}`); row(t('kFull'),`${sf} = ${sl} + 2${sb} ≈ <b>${fmt(Sl+2*Sb)}</b>${u}`,1); }
  else if(shape==='pyramid'){ const {n,a,h}=p, [ff,Sb]=nf(n,a), r=a/(2*Math.tan(PI/n)), m=Math.hypot(h,r), Sl=n*a*m/2;
    row(t('kRin'),`r = a / (2·tg(180°/n)) ≈ ${fmt(r)} ${t('cm')}`); row(t('kApo'),`m = √(h² + r²) ≈ ${fmt(m)} ${t('cm')}`);
    row(t('kBase'),`${sb} = ${ff} ≈ ${fmt(Sb)}${u}`); row(t('kLat'),`${sl} = ½·P·m = ½·${n}·${fmt(a)}·${fmt(m)} ≈ ${fmt(Sl)}${u}`); row(t('kFull'),`${sf} = ${sl} + ${sb} ≈ <b>${fmt(Sl+Sb)}</b>${u}`,1); }

    row(t('kRin1'),`r₁ ≈ ${fmt(r1)}, r₂ ≈ ${fmt(r2)} ${t('cm')}`); row(t('kApo'),`m = √(h² + (r₁ − r₂)²) ≈ ${fmt(m)} ${t('cm')}`);
    row(t('kBase1')+' / '+t('kBase2').toLowerCase(),`S₁ ≈ ${fmt(S1)}, S₂ ≈ ${fmt(S2)}${u}`); row(t('kLat'),`${sl} = ½·(P₁ + P₂)·m ≈ ${fmt(Sl)}${u}`); row(t('kFull'),`${sf} = ${sl} + S₁ + S₂ ≈ <b>${fmt(Sl+S1+S2)}</b>${u}`,1); }
  else if(shape==='tetra'){ row(t('kFull'),`S = √3·a² ≈ <b>${fmt(Math.sqrt(3)*p.a*p.a)}</b>${u}`,1); }
  else if(shape==='octa'){ row(t('kFull'),`S = 2√3·a² ≈ <b>${fmt(2*Math.sqrt(3)*p.a*p.a)}</b>${u}`,1); }
  else if(shape==='icosa'){ row(t('kFull'),`S = 5√3·a² ≈ <b>${fmt(5*Math.sqrt(3)*p.a*p.a)}</b>${u}`,1); }
  else if(shape==='dodeca'){ row(t('kFull'),`S = 3√(25 + 10√5)·a² ≈ <b>${fmt(3*Math.sqrt(25+10*Math.sqrt(5))*p.a*p.a)}</b>${u}`,1); }
  else if(shape==='cylinder'){ const {r,h}=p; row(t('kBase'),`${sb} = πr² = ${piv(r*r)}${u}`); row(t('kLat'),`${sl} = 2πrh = ${piv(2*r*h)}${u}`); row(t('kFull'),`${sf} = 2πr(r + h) = <b>${piv(2*r*(r+h))}</b>${u}`,1); }

function rng(seed){ let s=seed>>>0||1; return ()=>{ s^=s<<13; s^=s>>>17; s^=s<<5; return ((s>>>0)%100000)/100000; }; }

/* ================= picking ================= */
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
function pick(cx,cy){

  } else if(cur.type==='polyNet'){

    const ni=hit.object.userData.node, G=cur.groups[ni], local=hit.point.clone().applyMatrix4(new THREE.Matrix4().copy(G.ng.matrixWorld).invert());

const ptrs=new Map(); let downAt=null, moved=0, pinch0=0, dist0=0, hintGone=false;
const cv=renderer.domElement;
function killHint(){ if(!hintGone){ hintGone=true; $('#hint').classList.add('gone'); } }
cv.addEventListener('pointerdown',e=>{ cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); orbit.tween=null; orbit.vt=orbit.vp=0;
  if(ptrs.size===1){ downAt={x:e.clientX,y:e.clientY,t:performance.now()}; moved=0; } else if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinch0=Math.hypot(a.x-b.x,a.y-b.y); dist0=orbit.dist; moved=99; } });
cv.addEventListener('pointermove',e=>{ const p=ptrs.get(e.pointerId); if(!p) return; const dx=e.clientX-p.x, dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY;
  if(ptrs.size===1){ moved+=Math.abs(dx)+Math.abs(dy); const k=Math.PI/ Math.max(320, view.clientHeight); orbit.theta-=dx*k*1.6; orbit.phi=clamp(orbit.phi-dy*k*1.6,.04,PI-.04); orbit.vt=-dx*k*1.6; orbit.vp=-dy*k*1.6; if(moved>6) killHint(); }
  else if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); if(pinch0>0) orbit.dist=clamp(dist0*pinch0/d,SZ*1.2,SZ*40); killHint(); }
  applyCam(); markDirty(); });
const up=e=>{ if(!ptrs.has(e.pointerId)) return; ptrs.delete(e.pointerId); if(ptrs.size===0&&downAt&&moved<7&&performance.now()-downAt.t<600){ orbit.vt=orbit.vp=0; pick(e.clientX,e.clientY); markDirty(); } if(ptrs.size<2) pinch0=0; if(ptrs.size===1){ moved=99; } };
cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{ e.preventDefault(); orbit.dist=clamp(orbit.dist*Math.exp(e.deltaY*0.0012),SZ*1.2,SZ*40); orbit.tween=null; applyCam(); markDirty(); killHint(); },{passive:false});

  const S=scale, f=n=>(+n).toFixed(3), cut='stroke="#111" stroke-width="0.025" fill="none"', foldS='stroke="#111" stroke-width="0.02" stroke-dasharray="0.25 0.15" fill="none"', tabF='fill="#e6e8ee" stroke="#111" stroke-width="0.02"';

    const pts=[p,q,[q[0]-ux*ins+nx*d,q[1]-uy*ins+ny*d],[p[0]+ux*ins+nx*d,p[1]+uy*ins+ny*d]]; pts.forEach(v=>ext(v[0],v[1])); parts.push(`<polygon points="${pts.map(v=>f(v[0])+','+f(v[1])).join(' ')}" ${tabF}/>`); };

  if(!isRev()){
    if(!cur||cur.type!=='polyNet') return null;
    const {poly,nodes}=cur, fp=flatPolys(poly,nodes).map(P=>P.map(([x,y])=>[x*S,y*S]));
    const hinge=new Set(); nodes.forEach((n,i)=>{ if(n.parent>=0) hinge.add(i+':'+ekey(...n.hinge)), hinge.add(n.parent+':'+ekey(...n.hinge)); });
    const tabbed=new Set(), depth=Math.max(.5,Math.min(.9,SZ*S*.15));
    nodes.forEach((n,i)=>{ const F=poly.F[n.face], P=fp[i]; const cx=P.reduce((s,v)=>s+v[0],0)/P.length, cy=P.reduce((s,v)=>s+v[1],0)/P.length;
      F.forEach((a,k)=>{ const b=F[(k+1)%F.length], key=ekey(a,b); if(hinge.has(i+':'+key)) return; if(!tabbed.has(key)){ tabbed.add(key); tab(P[k],P[(k+1)%F.length],cx,cy,depth); } }); });
    nodes.forEach((n,i)=>{ const P=fp[i]; P.forEach(v=>ext(v[0],v[1])); parts.push(`<polygon points="${P.map(v=>f(v[0])+','+f(v[1])).join(' ')}" fill="#fff" stroke="none"/>`); });
    nodes.forEach((n,i)=>{ const F=poly.F[n.face], P=fp[i]; F.forEach((a,k)=>{ const b=F[(k+1)%F.length], p=P[k], q=P[(k+1)%F.length]; const isH=hinge.has(i+':'+ekey(a,b)); if(isH && !(n.parent>=0 && ekey(...n.hinge)===ekey(a,b))) return; parts.push(`<line x1="${f(p[0])}" y1="${f(p[1])}" x2="${f(q[0])}" y2="${f(q[1])}" ${isH?foldS:cut}/>`); }); });
    // fold lines from tabs side are cut lines already; mark tab hinges as fold
    nodes.forEach((n,i)=>{ const F=poly.F[n.face], P=fp[i], cx=P.reduce((s,v)=>s+v[0],0)/P.length, cy=P.reduce((s,v)=>s+v[1],0)/P.length; F.forEach((vi,k)=>{ const x=P[k][0]+(cx-P[k][0])*.16, y=P[k][1]+(cy-P[k][1])*.16; parts.push(`<text x="${f(x)}" y="${f(y)}" font-size="${f(Math.max(.28,Math.min(.45,SZ*S*.07)))}" fill="#7a8190" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif">${poly.labels[vi]}</text>`); }); });
  } else {
    if(state.shape==='sphere') return null;
    const {R1,R2,h}=revDims(), u=revNetUser(), r1=R1*S, r2=R2*S, H=h*S;
    const teeth=(cx,cy,r,skipAng)=>{ const n=Math.max(8,Math.floor(TAU*r/1.1)); for(let i=0;i<n;i++){ const a0=TAU*i/n, a1=TAU*(i+.62)/n; const mid=(a0+a1)/2; if(Math.abs(Math.atan2(Math.sin(mid-skipAng),Math.cos(mid-skipAng)))<.45) continue; const d=Math.min(.55,r*.3); const p=[cx+r*Math.cos(a0),cy+r*Math.sin(a0)], q=[cx+r*Math.cos(a1),cy+r*Math.sin(a1)]; tab(p,q,cx,cy,d); } };
    if(state.shape==='cylinder'){ const W=u.W*S;
      tab([W/2,-H/2],[W/2,H/2],0,0,.8);
      parts.push(`<rect x="${f(-W/2)}" y="${f(-H/2)}" width="${f(W)}" height="${f(H)}" fill="#fff" ${cut}/>`); ext(-W/2,-H/2); ext(W/2,H/2);
      [[0,H/2+r1,-PI/2],[0,-H/2-r1,PI/2]].forEach(([cx,cy,sk])=>{ teeth(cx,cy,r1,sk); parts.push(`<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(r1)}" fill="#fff" ${cut}/>`); ext(cx-r1,cy-r1); ext(cx+r1,cy+r1); });
    } else { const l=Math.hypot(h,R1-R2), L=(state.shape==='cone'?l:l*R1/(R1-R2))*S, Lin=state.shape==='cone'?0:L-l*S, Phi=u.angle*PI/180;
      const pt=(rho,psi)=>[rho*Math.cos(PI/2+psi),rho*Math.sin(PI/2+psi)];
      const a=pt(L,-Phi/2), b=pt(L,Phi/2), ai=pt(Lin,-Phi/2), bi=pt(Lin,Phi/2);
      tab(bi,b,0,L*.6,.8);
      const large=Phi>PI?1:0;
      const d= Lin>0? `M${f(ai[0])},${f(ai[1])} L${f(a[0])},${f(a[1])} A${f(L)},${f(L)} 0 ${large} 1 ${f(b[0])},${f(b[1])} L${f(bi[0])},${f(bi[1])} A${f(Lin)},${f(Lin)} 0 ${large} 0 ${f(ai[0])},${f(ai[1])} Z`: `M0,0 L${f(a[0])},${f(a[1])} A${f(L)},${f(L)} 0 ${large} 1 ${f(b[0])},${f(b[1])} Z`;
      parts.push(`<path d="${d}" fill="#fff" ${cut}/>`);
      for(let i=0;i<=64;i++){ const p=pt(L,-Phi/2+Phi*i/64); ext(p[0],p[1]); const q=pt(Lin,-Phi/2+Phi*i/64); ext(q[0],q[1]); } ext(0,0);
      teeth(0,L+r1,r1,-PI/2); parts.push(`<circle cx="0" cy="${f(L+r1)}" r="${f(r1)}" fill="#fff" ${cut}/>`); ext(-r1,L); ext(r1,L+2*r1);
      if(Lin>0){ teeth(0,Lin-r2,r2,PI/2); parts.push(`<circle cx="0" cy="${f(Lin-r2)}" r="${f(r2)}" fill="#fff" ${cut}/>`); ext(-r2,Lin-2*r2); }
    }
  }
  const m=.6; minX-=m; minY-=m+.7; maxX+=m; maxY+=m;
  const w=maxX-minX, hh=maxY-minY;
  const dims=SHAPES[state.shape].params.map(k=>`${paramDef(state.shape,k,P()).sym}=${fmt(P()[k])}`).join(', ');
  parts.push(`<text x="${f(minX+.3)}" y="${f(minY+.45)}" font-size="0.32" fill="#333" font-family="sans-serif">${title} (${dims} ${t('cm')})${scale!==1?' · '+t('pScale')+' '+fmt(scale):''}</text>`);
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${f(w*10)}mm" height="${f(hh*10)}mm" viewBox="${f(minX)} ${f(minY)} ${f(w)} ${f(hh)}">${parts.join('')}</svg>`;
  return {svg,w,h:hh};
}
const embedded=(()=>{ try{ return window.self!==window.top; }catch(e){ return true; } })();
function openPrint(){
  const modal=$('#modal'); const res=netSVG(printScale); if(!res) return;
  const fits=(res.w<=19.2&&res.h<=27.9)||(res.w<=27.9&&res.h<=19.2);
  modal.innerHTML=`<div class="card" role="dialog" aria-modal="true" aria-labelledby="pt"><header><h3 id="pt">${t('pTitle')} · ${t(state.shape)}</h3><button class="btn" id="pClose">${t('pClose')}</button></header>
  <div class="body"><div class="svgbox">${res.svg}</div><p class="note">${t('pSize',fmt(res.w),fmt(res.h))} <b style="color:var(${fits?'--ok':'--err'})">${fits?t('pFits'):t('pNoFit')}</b></p><p class="note">${t('pLegend')}</p>
  <label class="scale" for="pScaleIn">${t('pScale')} <input id="pScaleIn" type="number" min="0.2" max="3" step="0.1" value="${printScale}"></label>${embedded?`<p class="note">${t('pEmbedded')}</p>`:''}</div>
  <footer>${embedded?'':`<button class="btn pri" id="pPrint">${t('pPrint')}</button><button class="btn" id="pDl">${t('pDownload')}</button>`}<button class="btn ${embedded?'pri':''}" id="pCopy">${t('pCopy')}</button></footer></div>`;
  modal.hidden=false;
  $('#pClose').onclick=()=>{ modal.hidden=true; };
  modal.onclick=e=>{ if(e.target===modal) modal.hidden=true; };
  $('#pScaleIn').onchange=e=>{ printScale=clamp(parseFloat(e.target.value)||1,.2,3); openPrint(); };
  $('#pCopy').onclick=()=>{ const b=$('#pCopy'); const done=()=>{ b.textContent=t('pCopied'); setTimeout(()=>b.textContent=t('pCopy'),1600); };
    const fb=()=>{ const ta=document.createElement('textarea'); ta.value=res.svg; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); done();}catch(e){} ta.remove(); };
    try{ navigator.clipboard.writeText(res.svg).then(done,fb); }catch(e){ fb(); } };
  if(!embedded){
    $('#pPrint').onclick=()=>{ $('#printArea').innerHTML=res.svg; setTimeout(()=>window.print(),50); };
    $('#pDl').onclick=()=>{ const blob=new Blob([res.svg],{type:'image/svg+xml'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`razvertka-${state.shape}.svg`; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500); };
  }
}

/* ================= main loop ================= */
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(orbit.tween){ const tw=orbit.tween, k=ease(clamp((now-tw.start)/tw.ms,0,1)); orbit.theta=tw.from.theta+(tw.to.theta-tw.from.theta)*k; orbit.phi=tw.from.phi+(tw.to.phi-tw.from.phi)*k; orbit.dist=tw.from.dist+(tw.to.dist-tw.from.dist)*k; if(!state.anim) orbit.target.copy(tw.from.target).lerp(tw.to.target,k); if(k>=1) orbit.tween=null; dirty=true; }
  else if(ptrs.size===0 && (Math.abs(orbit.vt)>1e-4||Math.abs(orbit.vp)>1e-4)){ orbit.theta+=orbit.vt; orbit.phi=clamp(orbit.phi+orbit.vp,.04,PI-.04); orbit.vt*=.92; orbit.vp*=.92; dirty=true; }
  if(state.autorotate&&ptrs.size===0&&!orbit.tween){ orbit.theta+=dt*.45; dirty=true; }
  if(state.anim){ const a=state.anim, k=clamp((now-a.start)/a.ms,0,1); setT(a.from+(a.to-a.from)*k); if(k>=1){ const cb=a.cb; state.anim=null; if(a.to===1) reveal(); syncFoldBar(); if(state.mode==='build'&&state.t<=0.001) buildButtons(); cb&&cb(); } dirty=true; }
  if(dirty){ applyCam(); if(cur&&cur.type==='revModel'&&cur.update) cur.update(); renderer.render(scene,camera); updateLabels(); dirty=false; }
}
